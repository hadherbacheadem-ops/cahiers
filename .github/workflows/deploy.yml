# Publie le build sur GitHub Pages à chaque push sur main.
# L'app reste entièrement locale (IndexedDB du navigateur) : GitHub ne voit que le code compilé.
# Prérequis (une fois, dans les réglages du dépôt) : Settings → Pages → Source = « GitHub Actions ».
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Le site vit sous https://<utilisateur>.github.io/<dépôt>/ : la base est le nom du dépôt.
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
